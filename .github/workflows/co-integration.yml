name: Code Ocean integration

# Runs pull-request code in Code Ocean, never on the runner. A maintainer adds the
# `run-integration-test` label to approve each run; the label is removed when the run starts,
# so every new commit needs a fresh approval. The result is set as the
# `Code Ocean integration` commit status on the commit under test.
on:
  pull_request_target:
    types: [labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      test_commit:
        description: Commit to test
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: co-integration-${{ github.event.pull_request.number || inputs.test_commit }}
  cancel-in-progress: true

env:
  STATUS_CONTEXT: Code Ocean integration

jobs:
  code-ocean:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-integration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TEST_COMMIT: ${{ github.event.pull_request.head.sha || inputs.test_commit }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Remove approval label
        if: github.event_name == 'pull_request_target'
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label run-integration-test

      - name: Set pending status
        run: >
          gh api "repos/${{ github.repository }}/statuses/$TEST_COMMIT"
          -f state=pending -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL"
          -f description="Running in Code Ocean"

      # pull_request_target checks out the base branch, so pull-request code never reaches the runner.
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: astral-sh/setup-uv@v6

      - name: Run integration pipeline
        env:
          CODEOCEAN_TOKEN: ${{ secrets.CODEOCEAN_TOKEN }}
        run: >
          uv run --no-project --with codeocean==0.17.0
          .github/scripts/co_integration.py
          --pipeline-id "${{ vars.CO_INTEGRATION_TEST_PIPELINE_ID }}"
          --commit "$TEST_COMMIT"

      - name: Set final status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; description="Passed in Code Ocean" ;;
            failure) state=failure; description="Failed in Code Ocean" ;;
            *) state=error; description="Check did not finish ($JOB_STATUS)" ;;
          esac
          gh api "repos/${{ github.repository }}/statuses/$TEST_COMMIT" \
            -f state="$state" -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL" \
            -f description="$description"
